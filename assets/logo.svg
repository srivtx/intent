<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220" role="img" aria-label="Intent: sentences in, native code out">
  <title>Intent</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="760" height="220" rx="28" fill="url(#bg)"/>

  <!-- a sentence: three lines of words, ending in a full stop -->
  <g fill="#e5e7eb">
    <rect x="48" y="66" width="62" height="12" rx="6"/>
    <rect x="118" y="66" width="34" height="12" rx="6"/>
    <rect x="160" y="66" width="48" height="12" rx="6"/>
    <rect x="48" y="104" width="40" height="12" rx="6"/>
    <rect x="96" y="104" width="76" height="12" rx="6"/>
    <rect x="48" y="142" width="54" height="12" rx="6"/>
    <rect x="110" y="142" width="30" height="12" rx="6"/>
  </g>
  <circle cx="156" cy="148" r="8" fill="#fbbf24"/>

  <!-- becomes -->
  <g stroke="#fbbf24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M236 110 H286"/>
    <path d="M270 92 L290 110 L270 128"/>
  </g>

  <!-- machine code: a grid of bits -->
  <g>
    <rect x="318" y="60" width="26" height="26" rx="6" fill="#fbbf24"/>
    <rect x="352" y="60" width="26" height="26" rx="6" fill="#374151"/>
    <rect x="386" y="60" width="26" height="26" rx="6" fill="#e5e7eb"/>
    <rect x="318" y="94" width="26" height="26" rx="6" fill="#374151"/>
    <rect x="352" y="94" width="26" height="26" rx="6" fill="#e5e7eb"/>
    <rect x="386" y="94" width="26" height="26" rx="6" fill="#fbbf24"/>
    <rect x="318" y="128" width="26" height="26" rx="6" fill="#e5e7eb"/>
    <rect x="352" y="128" width="26" height="26" rx="6" fill="#fbbf24"/>
    <rect x="386" y="128" width="26" height="26" rx="6" fill="#374151"/>
  </g>

  <!-- wordmark -->
  <text x="462" y="124" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="76" font-weight="700" letter-spacing="-2" fill="#f9fafb">intent<tspan fill="#fbbf24">.</tspan></text>
  <text x="466" y="160" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="19" fill="#9ca3af">say what you mean. get a program.</text>
</svg>
